name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - name: Provision public tokenizer vocabulary before offline tests
        run: uv run --offline python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Offline tests (socket connections blocked by autouse fixture)
        run: uv run --offline pytest
        env:
          OPENAI_API_KEY: ''
      - run: uv run --offline ruff check .
      - run: uv run --offline ruff format --check .
