name: FinOps warehouse verification
on:
  push:
    paths:
      - 'experiments/finops_sql/**'
      - 'tests/test_finops_v3.py'
      - 'tests/test_acquire_finops_evaluation.py'
      - '.github/workflows/finops-checkpoint.yml'
      - 'uv.lock'
permissions:
  contents: read
jobs:
  warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - run: docker build -t meridian-worker:checkpoint1 experiments/finops_sql
      - name: Build the v3 worker from the verified dependency image
        run: docker build --network=none --pull=false -f experiments/finops_sql/v3/Dockerfile -t meridian-worker:v3 experiments/finops_sql
      - run: uv run --offline python -m experiments.finops_sql.generate .verification/finops
      - run: uv run --offline python -m experiments.finops_sql.checkpoint .verification/finops
      - name: Provision tokenizer for the offline SDK transport
        run: uv run --offline python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Run four-condition SDK-to-database verification
        env:
          FINOPS_VERIFIED_ROOT: .verification/finops
        run: uv run --offline pytest -q tests/test_finops_readiness.py tests/test_finops_v3.py tests/test_acquire_finops_evaluation.py
