name: FinOps warehouse verification
on:
  push:
    paths:
      - 'experiments/finops_sql/**'
      - '.github/workflows/finops-checkpoint.yml'
      - 'uv.lock'
permissions:
  contents: read
jobs:
  warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - run: docker build -t meridian-worker:checkpoint1 experiments/finops_sql
      - run: uv run --offline python -m experiments.finops_sql.generate .verification/finops
      - run: uv run --offline python -m experiments.finops_sql.checkpoint .verification/finops
