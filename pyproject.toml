[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-evaluation-lab"
version = "0.1.0"
description = "Small reproducible offline-first evaluation engine"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
openai = ["openai>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "openai>=2,<3"]

[project.scripts]
eval-lab = "eval_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
