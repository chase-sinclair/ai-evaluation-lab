<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Where the second check sits</title>
  <desc id="desc">Each path starts with a question and preselected evidence. The gate checks evidence before generation. The verifier checks the generated answer. PASS releases the shared answer and BLOCK yields a fixed referral.</desc>
  <rect width="800" height="400" fill="#fff"/>
  <g font-family="Arial, sans-serif">
    <text x="12" y="31" font-size="27" font-weight="700" fill="#163844">Where the second check sits</text>
    <text x="12" y="60" font-size="19" fill="#163844">Shared input · Question + frozen packet</text>
    <rect x="8" y="82" width="784" height="70" rx="8" fill="#eef4f4"/>
    <text x="20" y="108" font-size="20" font-weight="700" fill="#163844">A · Standard RAG</text>
    <text x="20" y="136" font-size="18" fill="#163844">Generate reply</text>
    <text x="345" y="128" font-size="23" font-weight="700" fill="#163844">→</text>
    <text x="405" y="124" font-size="17" font-weight="700" fill="#163844">→ Release reply</text>
    <rect x="8" y="165" width="784" height="99" rx="8" fill="#eef4f4"/>
    <text x="20" y="191" font-size="20" font-weight="700" fill="#163844">B · Pre-generation gate</text>
    <text x="20" y="219" font-size="18" fill="#163844">Check evidence</text>
    <text x="345" y="211" font-size="23" font-weight="700" fill="#163844">→</text>
    <rect x="405" y="184" width="70" height="23" rx="4" fill="#185b51"/>
    <text x="412" y="201" font-size="15" font-weight="700" fill="#fff">PASS</text>
    <text x="485" y="201" font-size="16" fill="#163844">Generate → Release reply</text>
    <rect x="405" y="216" width="70" height="23" rx="4" fill="#823a24"/>
    <text x="412" y="233" font-size="15" font-weight="700" fill="#fff">BLOCK</text>
    <text x="485" y="233" font-size="16" fill="#163844">Return fixed referral</text>
    <rect x="8" y="277" width="784" height="105" rx="8" fill="#eef4f4"/>
    <text x="20" y="303" font-size="20" font-weight="700" fill="#163844">C · Post-generation verifier</text>
    <text x="20" y="331" font-size="18" fill="#163844">Generate reply → Verify answer</text>
    <text x="345" y="323" font-size="23" font-weight="700" fill="#163844">→</text>
    <rect x="405" y="296" width="70" height="23" rx="4" fill="#185b51"/>
    <text x="412" y="313" font-size="15" font-weight="700" fill="#fff">PASS</text>
    <text x="485" y="313" font-size="16" fill="#163844">Release original reply</text>
    <rect x="405" y="328" width="70" height="23" rx="4" fill="#823a24"/>
    <text x="412" y="345" font-size="15" font-weight="700" fill="#fff">BLOCK</text>
    <text x="485" y="345" font-size="16" fill="#163844">Return fixed referral</text>
  </g>
</svg>
