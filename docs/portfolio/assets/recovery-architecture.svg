<svg xmlns="http://www.w3.org/2000/svg" width="780" height="466" viewBox="0 0 780 466" role="img" aria-labelledby="title desc">
  <title id="title">One failure, three responses</title>
  <desc id="desc">A reports status. B and C may propose a write. Only an authorized proposal enters the mock API. Grading is independent of the model.</desc>
  <rect width="780" height="466" fill="#fff"/>
  <g font-family="Arial, sans-serif">
    <text x="12" y="34" font-size="28" fill="#17394b" font-weight="700">One failure, three responses</text>
    <rect x="10" y="52" width="760" height="73" rx="8" fill="#edf4f4"/>
    <text x="24" y="81" font-size="19" fill="#17394b" font-weight="700">Shared starting point</text>
    <text x="24" y="108" font-size="16" fill="#17394b">Same scripted error, original request and public transaction facts.</text>
    <rect x="10" y="141" width="245" height="96" rx="8" fill="#edf4f4"/>
    <text x="24" y="170" font-size="19" fill="#17394b" font-weight="700">A · Stop and report</text>
    <text x="24" y="197" font-size="16" fill="#17394b">Report the known status.</text>
    <text x="24" y="220" font-size="16" fill="#17394b">No recovery write.</text>
    <rect x="265" y="141" width="245" height="96" rx="8" fill="#edf4f4"/>
    <text x="279" y="170" font-size="19" fill="#17394b" font-weight="700">B · Apply rules</text>
    <text x="279" y="197" font-size="16" fill="#17394b">Frozen rules select one</text>
    <text x="279" y="220" font-size="16" fill="#17394b">correction or stop.</text>
    <rect x="520" y="141" width="245" height="96" rx="8" fill="#edf4f4"/>
    <text x="534" y="170" font-size="19" fill="#17394b" font-weight="700">C · Ask the model</text>
    <text x="534" y="197" font-size="16" fill="#17394b">One native proposal</text>
    <text x="534" y="220" font-size="16" fill="#17394b">or a structured stop.</text>
    <text x="14" y="255" font-size="17" fill="#126158" font-weight="700">↓  Proposed writes from B or C only</text>
    <rect x="10" y="268" width="760" height="73" rx="8" fill="#17594f"/>
    <text x="24" y="297" font-size="19" fill="#fff" font-weight="700">Independent guard</text>
    <text x="24" y="324" font-size="16" fill="#fff">Validate syntax, scope, direction and replay safety. Reject unsafe proposals.</text>
    <text x="14" y="371" font-size="17" fill="#126158" font-weight="700">↓  Authorized call only</text>
    <rect x="10" y="383" width="760" height="73" rx="8" fill="#edf4f4"/>
    <text x="24" y="412" font-size="19" fill="#17394b" font-weight="700">Local mock API and ledger</text>
    <text x="24" y="439" font-size="16" fill="#17394b">Apply once or confirm a prior effect. A separate grader checks state, effect count and status.</text>
  </g>
</svg>
