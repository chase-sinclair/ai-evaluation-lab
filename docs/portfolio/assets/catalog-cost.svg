<svg xmlns="http://www.w3.org/2000/svg" width="610" height="365" viewBox="0 0 610 365" role="img" aria-labelledby="title desc">
<title id="title">Primary token usage and cost</title>
<desc id="desc">Zero-based bars within each panel show primary input and estimated cost totals across both layouts.</desc>
<rect width="610" height="365" fill="#f5f8f8"/>
<g font-family="Arial, sans-serif">
