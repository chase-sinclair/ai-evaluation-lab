<text x="22" y="66" font-size="16" fill="#506576">Same 18 shared tasks × two layouts per catalog</text>
<text x="22" y="109" font-size="18" font-weight="700" fill="#163548">Input tokens</text>
<text x="22" y="138" font-size="16" fill="#163548">5 tools</text>
<rect x="108" y="125" width="139" height="16" rx="3" fill="#157568"/>
<text x="432" y="138" font-size="16" font-weight="700" fill="#163548">12,668</text>
<text x="22" y="168" font-size="16" fill="#163548">10 tools</text>
<rect x="108" y="155" width="189" height="16" rx="3" fill="#157568"/>
<text x="432" y="168" font-size="16" font-weight="700" fill="#163548">17,168</text>
<text x="22" y="198" font-size="16" fill="#163548">20 tools</text>
<rect x="108" y="185" width="306" height="16" rx="3" fill="#157568"/>
<text x="432" y="198" font-size="16" font-weight="700" fill="#163548">27,860</text>
<text x="22" y="251" font-size="18" font-weight="700" fill="#163548">Estimated API cost (USD)</text>
<text x="22" y="280" font-size="16" fill="#163548">5 tools</text>
<rect x="108" y="267" width="168" height="16" rx="3" fill="#163548"/>
<text x="432" y="280" font-size="16" font-weight="700" fill="#163548">$0.0020848</text>
<text x="22" y="310" font-size="16" fill="#163548">10 tools</text>
<rect x="108" y="297" width="215" height="16" rx="3" fill="#163548"/>
<text x="432" y="310" font-size="16" font-weight="700" fill="#163548">$0.0026703</text>
<text x="22" y="340" font-size="16" fill="#163548">20 tools</text>
<rect x="108" y="327" width="306" height="16" rx="3" fill="#163548"/>
