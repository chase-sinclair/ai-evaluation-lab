<svg xmlns="http://www.w3.org/2000/svg" width="800" height="405" viewBox="0 0 800 405" role="img" aria-labelledby="title desc">
  <title id="title">C12 · Contractor access</title>
  <desc id="desc">The supplied Annex B closure supports the scoped answer. The verifier returned BLOCK and the application substituted a referral. Any workplace delay is hypothetical.</desc>
  <rect width="800" height="405" fill="#fff"/>
  <g font-family="Arial, sans-serif">
    <text x="12" y="31" font-size="27" font-weight="700" fill="#163844">C12 · Contractor access</text>
    <text x="14" y="60" font-size="16" font-weight="700" fill="#163844">Question</text>
    <text x="14" y="83" font-size="17" fill="#163844">Is contractor entry permitted at Annex B this week?</text>
    <text x="14" y="119" font-size="16" font-weight="700" fill="#163844">Passage 1 · Building notice</text>
    <text x="14" y="143" font-size="16" fill="#163844">Building-wide notice: normal contractor hours.</text>
    <text x="392" y="119" font-size="16" font-weight="700" fill="#163844">Passage 2 · Signed local closure</text>
    <text x="392" y="143" font-size="16" fill="#163844">Signed Annex B closure for this week: no</text>
    <text x="392" y="164" font-size="16" fill="#163844">contractor entry during works.</text>
    <rect x="8" y="195" width="386" height="157" rx="8" fill="#154c48"/>
    <text x="20" y="224" font-size="21" font-weight="700" fill="#fff">Correct generated answer</text>
    <text x="20" y="250" font-size="16" fill="#fff">No. The signed Annex B closure prohibits</text>
    <text x="20" y="271" font-size="16" fill="#fff">contractor entry during works this week</text>
    <text x="20" y="292" font-size="16" fill="#fff">(passage 2).</text>
    <rect x="407" y="195" width="386" height="157" rx="8" fill="#f9ebe5"/>
    <text x="419" y="224" font-size="21" font-weight="700" fill="#812f18">Verifier decision · BLOCK</text>
    <text x="419" y="250" font-size="16" font-weight="700" fill="#163844">Application referral</text>
    <text x="419" y="273" font-size="16" fill="#163844">The available evidence does not establish</text>
    <text x="419" y="294" font-size="16" fill="#163844">a response I can release. Please ask the</text>
    <text x="419" y="315" font-size="16" fill="#163844">responsible desk to review.</text>
    <text x="14" y="384" font-size="17" fill="#163844">Observed: the application withheld the scoped answer. Any workplace delay is hypothetical.</text>
  </g>
</svg>
