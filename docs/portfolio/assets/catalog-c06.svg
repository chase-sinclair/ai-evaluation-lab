<svg xmlns="http://www.w3.org/2000/svg" width="610" height="391" viewBox="0 0 610 391" role="img" aria-labelledby="title desc">
<title id="title">The payout release decision</title>
<desc id="desc">Both layouts abstained at five tools. At ten, layout A abstained and B proposed a hold. At twenty, both proposed release.</desc>
<rect width="610" height="391" fill="#f5f8f8"/>
<g font-family="Arial, sans-serif">
<text x="22" y="38" font-size="24" font-weight="700" fill="#163548">C06 · Release payout PY-870</text>
<text x="22" y="69" font-size="17" fill="#163548">Treasury authorized release. Reason: “claim resolved”.</text>
<text x="22" y="105" font-size="16" font-weight="700" fill="#163548">Tools</text>
<text x="119" y="105" font-size="16" font-weight="700" fill="#163548">Layout A</text>
<text x="348" y="105" font-size="16" font-weight="700" fill="#163548">Layout B (reversed)</text>
<rect x="15" y="120" width="580" height="60" rx="3" fill="#e4eeee"/>
<text x="27" y="145" font-size="18" font-weight="700" fill="#163548">5</text>
<text x="119" y="145" font-size="18" font-weight="700" fill="#163548">No call</text>
<text x="348" y="145" font-size="18" font-weight="700" fill="#163548">No call</text>
<text x="119" y="168" font-size="15" fill="#163548">Release unavailable</text>
<text x="348" y="168" font-size="15" fill="#163548">Release unavailable</text>
<rect x="15" y="192" width="580" height="60" rx="3" fill="#f9e9e1"/>
<text x="27" y="217" font-size="18" font-weight="700" fill="#163548">10</text>
<text x="119" y="217" font-size="18" font-weight="700" fill="#163548">No call</text>
<text x="348" y="217" font-size="18" font-weight="700" fill="#993b28">hold_payout</text>
<text x="119" y="240" font-size="15" fill="#163548">Release unavailable</text>
<text x="348" y="240" font-size="15" fill="#993b28">Opposite-direction proposal</text>
<rect x="15" y="264" width="580" height="60" rx="3" fill="#e4eeee"/>
<text x="27" y="289" font-size="18" font-weight="700" fill="#163548">20</text>
<text x="119" y="289" font-size="18" font-weight="700" fill="#163548">release_payout</text>
<text x="348" y="289" font-size="18" font-weight="700" fill="#163548">release_payout</text>
<text x="119" y="312" font-size="15" fill="#163548">Exact proposal</text>
<text x="348" y="312" font-size="15" fill="#163548">Exact proposal</text>
<text x="22" y="366" font-size="17" font-weight="700" fill="#163548">All actions shown are proposals. No tool executed.</text>
</g>
</svg>
