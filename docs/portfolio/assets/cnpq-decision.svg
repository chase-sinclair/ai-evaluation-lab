<svg xmlns="http://www.w3.org/2000/svg" width="590" height="447" viewBox="0 0 590 447" role="img" aria-labelledby="title desc">
  <title id="title">What happened to “CNPq process”</title>
  <desc id="desc">Center for Process Studies was offered first at 0.522. The Brazilian funder with the CNPq acronym was offered second at 0.500. The baseline abstained. The frozen rule placed this query 30th among 38, last of four in the pilot. With all four escalated the model selected the correct second ID.</desc>
  <style>
    text {font-family:'Segoe UI',Arial,sans-serif;fill:#173d39}
    .head {font-size:21px;font-weight:650}
    .body {font-size:17px}
    .note {font-size:16px;fill:#40564f}
    .score {font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
  </style>
  <rect width="590" height="447" rx="12" fill="#f3f7f5"/>
  <text x="22" y="33" class="head">“CNPq process”</text>
  <text x="22" y="59" class="note">First two of the five offered organizations</text>
  <rect x="20" y="76" width="550" height="62" rx="6" fill="#fff" stroke="#91aaa0"/>
  <text x="33" y="102" class="body">1. Center for Process Studies · US</text>
  <text x="33" y="125" class="note">Matched alias: ctr4process</text>
  <text x="556" y="112" class="score" text-anchor="end">0.522</text>
  <rect x="20" y="146" width="550" height="64" rx="6" fill="#dcece5" stroke="#608774"/>
  <text x="33" y="172" class="body">2. Brazilian research council · Brazil</text>
  <text x="33" y="197" class="note">Matched acronym: CNPq · Correct ROR target</text>
  <text x="556" y="184" class="score" text-anchor="end">0.500</text>
  <path d="M34 236v151" stroke="#78968f" stroke-width="2"/>
  <g fill="#325f54"><circle cx="34" cy="239" r="5"/><circle cx="34" cy="307" r="5"/><circle cx="34" cy="377" r="5"/></g>
  <text x="54" y="246" class="head">Baseline abstained</text>
  <text x="54" y="270" class="note">The top score and the gap both fell below their thresholds.</text>
  <text x="54" y="314" class="head">Escalation rank: 30th of 38</text>
  <text x="54" y="339" class="note">The low leading score put it far from the link threshold.</text>
  <text x="54" y="384" class="head">One live repair</text>
  <text x="54" y="410" class="note">At full pilot escalation, the model chose the second ID.</text>
</svg>
